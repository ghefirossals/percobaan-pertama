<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personel Ability List TCR</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            
            position: relative;
            overflow: hidden;
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 300px;
            width: 90%;
        }
        
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #004b73 0%, #115c44 100%); 
}
        
        h1 {
            color: #1a202c;
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .subtitle {
            color: #718096;
            font-size: 14px;
            font-weight: 500;
            margin-top: 0;
            margin-bottom: 28px;
        }

        /* Desain Kolom Input */
        .form-group {
            text-align: left;
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            background-color: #ebf3fe;
            border: 1px solid #d3e3f8;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: #0070f3;
        }

        /* Pembungkus Password & Tombol Mata */
        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-wrapper input {
            padding-right: 42px; /* Memberikan ruang agar teks tidak tertutup ikon */
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            color: #718096;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .toggle-password:hover {
            color: #1a202c;
        }

        /* Desain Tombol Utama */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(90deg, #004b73 0%, #115c44 100%); 
            color: #ffffff;
        }

        .btn-primary:hover {
            opacity: 0.92;
        }

        .btn-secondary {
            background-color: #ebf3fe;
            color: #004b73;
        }

        .btn-secondary:hover {
            background-color: #dbe8fc;
        }

        .btn-back {
            background: none;
            color: #718096;
            font-size: 13px;
            cursor: pointer;
            border: none;
            margin-top: 10px;
        }

        .btn-back:hover {
            color: #1a202c;
        }

        .info-box {
            margin-top: 24px;
            font-size: 12px;
            color: #a0aec0;
            line-height: 1.5;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- TAMPILAN 1: HALAMAN UTAMA -->
        <div id="view-home">
            <h1>Personel Ability List TCR</h1>
            <p class="subtitle">CI 584461</p>

            <div class="btn-group">
                <button class="btn btn-primary" onclick="bukaHalamanLogin()">Login</button>
                <button class="btn btn-secondary" onclick="aksesTamu()">Masuk Tanpa Akun</button>
            </div>

            <div class="info-box">
                <p>* <strong>Login:</strong> Untuk akses penuh.</p>
                <p>* <strong>Tanpa Akun:</strong> Untuk akses terbatas.</p>
            </div>
        </div>

        <!-- TAMPILAN 2: FORM LOGIN -->
        <div id="view-login" class="hidden">
            <h1>Personel Ability List TCR</h1>
            <p class="subtitle">Please enter your name and password to log in.</p>

            <form onsubmit="prosesLogin(event)">
                <div class="form-group">
                    <label for="userId">ID / Nama User</label>
                    <input type="text" id="userId" placeholder="Masukkan ID Anda" required>
                </div>

                <div class="form-group">
                    <label for="userPassword">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="userPassword" placeholder="Masukkan Password" required>
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility()" aria-label="Tampilkan Password">
                            <!-- Ikon Mata (SVG) -->
                            <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="btn-group">
                    <button type="submit" class="btn btn-primary">Login</button>
                </div>
            </form>

            <button class="btn-back" onclick="bukaHalamanUtama()">← Kembali ke Halaman Utama</button>
        </div>

    </div>

    <script>
        function bukaHalamanLogin() {
            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-login').classList.remove('hidden');
        }

        function bukaHalamanUtama() {
            document.getElementById('view-login').classList.add('hidden');
            document.getElementById('view-home').classList.remove('hidden');
        }

        function aksesTamu() {
            alert("Masuk sebagai Tamu (Mode Hanya Lihat & Unduh Dokumen)");
        }

        function prosesLogin(event) {
            event.preventDefault();
            const id = document.getElementById('userId').value;
            alert("Login berhasil untuk ID: " + id);
        }

        /* Fungsi Toggle Tampilkan / Sembunyikan Password */
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('userPassword');
            const eyeIcon = document.getElementById('eye-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                // Ganti gambar ikon mata terbuka menjadi mata tercontreng/dicoret (eye-off)
                eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
            } else {
                passwordInput.type = 'password';
                // Kembalikan ke ikon mata biasa
                eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
            }
        }
    </script>

</body>
</html>
