<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personel Ability List TCR</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 480px;
            width: 90%;
        }

        h1 {
            color: #1a202c;
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 2px; /* Dibuat rapat dengan subtitle */
        }

        .subtitle {
            color: #718096;
            font-size: 14px;
            font-weight: 500;
            margin-top: 0;
            margin-bottom: 28px;
        }

        /* Desain Kolom Input (Form) */
        .form-group {
            text-align: left;
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: #0070f3;
        }

        /* Desain Tombol */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: #0070f3;
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: #0051a2;
        }

        .btn-secondary {
            background-color: #e2e8f0;
            color: #2d3748;
        }

        .btn-secondary:hover {
            background-color: #cbd5e0;
        }

        .btn-back {
            background: none;
            color: #718096;
            font-size: 13px;
            cursor: pointer;
            border: none;
            margin-top: 10px;
        }

        .btn-back:hover {
            color: #1a202c;
        }

        .info-box {
            margin-top: 24px;
            font-size: 12px;
            color: #a0aec0;
            line-height: 1.5;
        }

        /* Class untuk menyembunyikan tampilan */
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- TAMPILAN 1: HALAMAN UTAMA -->
        <div id="view-home">
            <h1>Personel Ability List TCR</h1>
            <p class="subtitle">Dashboard PAL TCR</p>

            <div class="btn-group">
                <button class="btn btn-primary" onclick="bukaHalamanLogin()">Login</button>
                <button class="btn btn-secondary" onclick="aksesTamu()">Masuk Tanpa Akun</button>
            </div>

            <div class="info-box">
                <p>* <strong>Login:</strong> Akses penuh untuk melihat, menambah, dan mengubah data.</p>
                <p>* <strong>Tanpa Akun:</strong> Akses terbatas untuk melihat dan mengunduh dokumen.</p>
            </div>
        </div>

        <!-- TAMPILAN 2: FORM LOGIN -->
        <div id="view-login" class="hidden">
            <h1>Personel Ability List TCR</h1>
            <p class="subtitle">Please enter your name and password to log in.</p>

            <form onsubmit="prosesLogin(event)">
                <div class="form-group">
                    <label for="userId">ID / Nama User</label>
                    <input type="text" id="userId" placeholder="Masukkan ID Anda" required>
                </div>

                <div class="form-group">
                    <label for="userPassword">Password</label>
                    <input type="password" id="userPassword" placeholder="Masukkan Password" required>
                </div>

                <div class="btn-group">
                    <button type="submit" class="btn btn-primary">Login</button>
                </div>
            </form>

            <button class="btn-back" onclick="bukaHalamanUtama()">← Kembali ke Halaman Utama</button>
        </div>

    </div>

    <script>
        function bukaHalamanLogin() {
            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-login').classList.remove('hidden');
        }

        function bukaHalamanUtama() {
            document.getElementById('view-login').classList.add('hidden');
            document.getElementById('view-home').classList.remove('hidden');
        }

        function aksesTamu() {
            alert("Masuk sebagai Tamu (Mode Hanya Lihat & Unduh Dokumen)");
        }

        function prosesLogin(event) {
            event.preventDefault();
            const id = document.getElementById('userId').value;
            alert("Login berhasil untuk ID: " + id);
        }
    </script>

</body>
</html>
